name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  # 記事リポジトリ (blog-content) に push されたときに呼ばれる
  repository_dispatch:
    types: [content-updated]
  # Actions 画面から手動で再デプロイできるように
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 記事は private リポジトリにあるので、最新版を content/ に取り込む
      # fetch-depth: 0 は記事の作成日・更新日を git 履歴から取るため
      - name: Checkout content
        uses: actions/checkout@v7
        with:
          repository: ryoca-knot/blog-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
